services:
  postgres:
    image: postgres:16
    container_name: cudf-pandas-fix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cudf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cudf}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cudf}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
