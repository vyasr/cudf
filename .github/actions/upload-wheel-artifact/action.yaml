name: Upload wheel artifact
description: Upload one wheel artifact while preserving the wheel-test and publisher artifact contract.

inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Wheel output directory to upload.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        if-no-files-found: error
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
